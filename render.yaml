services:
  - type: web
    name: textualize-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard (required)
      - key: SECRET_KEY
        sync: false # Set this in the Render dashboard (required)
      - key: UPLOAD_FILE_DIR
        value: /var/data
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    healthCheckPath: /api/docs
